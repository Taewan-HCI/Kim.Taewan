---
layout: default
---
<article class="post">
    <div class="post-header">
        <a href="{{ '/posts/' | relative_url }}" class="post-back">← Posts</a>
        <time class="post-date">{{ page.date | date: "%b %-d, %Y" }}</time>
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.tags %}
        <div class="post-tags">
            {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
        </div>
        {% endif %}
    </div>

    <div class="post-body">
        {{ content }}
    </div>

    <div class="post-footer">
        <a href="{{ '/posts/' | relative_url }}" class="post-back">← All posts</a>
    </div>
</article>
