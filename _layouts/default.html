<script>
// ── Background graph animation ────────────────────
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const isMobile = () => window.innerWidth < 641;
  const NUM = isMobile() ? 8 : 22;
  let nodes = [];
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function init() {
    nodes = Array.from({ length: NUM }, () => ({
      x:  Math.random() * W,
      y:  Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      pulse: 0,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // nodes only — no connecting lines, kept very quiet
    nodes.forEach(n => {
      const r = 1.4 + n.pulse * 2.5;
      const a = 0.1 + n.pulse * 0.22;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(60,57,48,${a})`;
      ctx.fill();

      // pulse ring
      if (n.pulse > 0.05) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 5 * (1 - n.pulse), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(60,57,48,${n.pulse * 0.08})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    });
  }

  function tick() {
    nodes.forEach(n => {
      n.x += n.vx;
      n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
      if (n.pulse > 0) n.pulse = Math.max(0, n.pulse - 0.018);
    });
    draw();
    requestAnimationFrame(tick);
  }

  // random pulse
  setInterval(() => {
    nodes[Math.floor(Math.random() * NUM)].pulse = 1;
  }, isMobile() ? 3600 : 1800);

  resize();
  window.addEventListener('resize', () => { resize(); init(); });
  init();
  tick();
})();
</script>
